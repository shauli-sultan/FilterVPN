<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>האתר נחסם | FilterVPN</title>
<style>
body{font-family:Arial,sans-serif;background:#f1f5f9;color:#111;margin:0;padding:2em 1em}
.card{max-width:560px;margin:0 auto;background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:2em;text-align:center}
.emoji{font-size:64px}
h1{font-size:1.8em;margin:.3em 0}
.host{color:#64748b;word-break:break-all}
.reason{background:#fef3c7;border:1px solid #fcd34a;border-radius:10px;padding:.8em;margin:1.2em 0;font-weight:bold}
small{color:#64748b}
</style>
</head>
<body>
<div class="card">
<div class="emoji">🚫</div>
<h1>האתר נחסם</h1>
<p>הגישה לאתר <b class="host">{host}</b> נחסמה על ידי מערכת הסינון FilterVPN.</p>
<div class="reason">הסיבה: {reason}</div>
<p><small>אם לדעתכם מדובר בטעות, פנו למנהל המערכת.<br>🛡️ FilterVPN — גלישה בטוחה</small></p>
</div>
</body>
</html>
