# Squid 6 — intercept for Tier 2/3 only (iptables REDIRECT 80->3128, 443->3129).
# Pinned/banked domains bypass ssl_bump (DNS enforcement instead).
# Dummy non-intercept port 3130 fixes Squid 6.14 mimeLoadIcon FATAL when only intercept ports exist (needs a forward-proxy port).
visible_hostname filter-vpn
http_port 127.0.0.1:3130
http_port 127.0.0.1:3128 intercept
https_port 127.0.0.1:3129 intercept ssl-bump cert=/opt/filtervpn/proxy/ca/squid-dynamic.pem generate-host-certificates=on dynamic_cert_mem_cache_size=16MB

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/ssl_db -M 16MB
sslcrtd_children 4

acl pinned dstdomain .youtube.com .googlevideo.com .instagram.com .tiktok.com .facebook.com .snapchat.com .reddit.com .twitter.com .x.com
acl banking dstdomain .bank .chase.com .wellsfargo.com .paypal.com .gov .irs.gov
# WhatsApp must stay working everywhere: cert-pinned app traffic passes through untouched.
acl whatsapp dstdomain .whatsapp.com .whatsapp.net
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump splice pinned
ssl_bump splice banking
ssl_bump splice whatsapp
ssl_bump bump all

# Inject YouTube restrict header on bumped responses where applicable
request_header_add YouTube-Restrict Strict all

# ICAP worker (Tier 2/3 image/URL filtering) — DISABLED for speed (was causing 500 + forwarding loop when worker down).
# Worker is fixed (handles OPTIONS), but keep disabled until you need heuristic image blocking — re-enable by uncommenting.
#icap_enable on
#icap_service filtervpn_resp respmod_precache icap://127.0.0.1:1344/respmod
#adaptation_access filtervpn_resp allow all

access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache deny all
coredump_dir /var/spool/squid

http_access allow localhost
http_access allow all
