# Squid 6 — intercept for Tier 2/3 only (iptables REDIRECT 80->3128, 443->3129).
# Pinned/banked domains bypass ssl_bump (DNS enforcement instead).
http_port 3128 intercept
https_port 3129 intercept ssl-bump cert=/opt/filtervpn/proxy/ca/squid-dynamic.pem generate-host-certificates=on dynamic_cert_mem_cache_size=16MB

sslcrtd_program /usr/lib/squid/security_file_certgen -s /var/lib/ssl_db -M 16MB
sslcrtd_children 4

acl pinned dstdomain .youtube.com .googlevideo.com .instagram.com .tiktok.com .facebook.com .snapchat.com .reddit.com .twitter.com .x.com
acl banking dstdomain .bank .chase.com .wellsfargo.com .paypal.com .gov .irs.gov
acl step1 at_step SslBump1
ssl_bump peek step1
ssl_bump splice pinned
ssl_bump splice banking
ssl_bump bump all

# Inject YouTube restrict header on bumped responses where applicable
request_header_add YouTube-Restrict Strict all

icap_enable on
icap_service filtervpn_resp respmod_precache icap://127.0.0.1:1344/respmod
adaptation_access filtervpn_resp allow all

access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
cache deny all

http_access allow localhost
http_access allow all
