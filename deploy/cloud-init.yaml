#cloud-config
package_update: true
package_upgrade: false
packages:
  - wireguard
  - wireguard-tools
  - iptables-persistent
  - nftables
  - squid-openssl
  - python3
  - python3-pip
  - python3-venv
  - qrencode
  - curl
  - dnsutils
  - iproute2

write_files:
  - path: /etc/sysctl.d/99-filtervpn.conf
    content: |
      net.ipv4.ip_forward=1
      net.ipv6.conf.all.forwarding=1
      net.core.rmem_max=26214400
      net.core.wmem_max=26214400

runcmd:
  - sysctl --system
  - systemctl enable --now wg-quick@wg0 || true
