# WayGuard — Nginx Stream SNI router for DoT on single IP:853
# Routes yishiva-*.duckdns.org via SNI to correct local CoreDNS tier.
# Option A: Termination (recommended) — Nginx terminates TLS with SAN cert, proxies plain DNS to 5351-5354
# Option B: Passthrough — uncomment passthrough block, enable CoreDNS tls on 8531-8534 instead.

# --- Option A: Termination (single SAN cert covering all 4 hosts) ---
stream {
    # Map SNI → plain CoreDNS backend
    map $ssl_preread_server_name $backend_plain {
        yishiva-basic.duckdns.org      127.0.0.1:5351;
        yishiva-filtered.duckdns.org   127.0.0.1:5352;
        yishiva-mehadrin.duckdns.org   127.0.0.1:5353;
        yishiva-super.duckdns.org      127.0.0.1:5354;
        default                        127.0.0.1:5351;
    }

    # Log SNI for debugging
    log_format dot '$remote_addr [$time_local] SNI:$ssl_preread_server_name -> $backend_plain';
    access_log /var/log/nginx/dot-access.log dot;
    error_log /var/log/nginx/dot-error.log;

    server {
        listen 853 ssl;
        # SAN cert (acme.sh): contains all 4 yishiva-*.duckdns.org
        ssl_certificate /etc/nginx/tls/combined-fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/combined-key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_preread on;
        proxy_pass $backend_plain;
        # Preserve client IP via PROXY protocol if CoreDNS supports it (optional)
        # proxy_protocol on;
    }
}

